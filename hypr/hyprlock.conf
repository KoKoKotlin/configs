# ~/.config/hypr/hyprlock.conf — colors match waybar/mako

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot      # blurred picture of the desktop
    blur_passes = 3
    blur_size = 7
}

label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = JetBrainsMono NF
    color = rgb(e6842e)
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    outer_color = rgb(e6842e)
    inner_color = rgb(1d1f21)
    font_color = rgb(e6842e)
    check_color = rgb(589df6)
    fail_color = rgb(c9545d)
    placeholder_text = Password...
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
