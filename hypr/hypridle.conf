# ~/.config/hypr/hypridle.conf — lock, screen off and suspend when idle

general {
    lock_cmd = pidof hyprlock || hyprlock        # avoid starting hyprlock twice
    before_sleep_cmd = loginctl lock-session     # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on   # no need to press a key twice
}

# Lock after 5 minutes
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Screens off 30 s later
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 30 minutes
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
