# ~/.config/hypr/hyprpaper.conf — hyprpaper 0.8+ syntax
splash = false

# Empty monitor = fallback for every screen without its own wallpaper block.
# For a different image per screen, add blocks with `monitor = DP-1` etc.
wallpaper {
    monitor =
    path = ~/Pictures/wallpapers/emacs.png
    fit_mode = cover
}
